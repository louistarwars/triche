name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Licences Android (SDK déjà installé sur le runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests de la logique (détection + simulation du jeu)
        run: ./gradlew -p sim test --no-daemon

      - name: Compilation de l'APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Préparer l'APK
        run: cp app/build/outputs/apk/debug/triche-stack-debug.apk triche-stack.apk

      - uses: actions/upload-artifact@v4
        with:
          name: triche-stack
          path: triche-stack.apk

      - name: Envoyer l'APK sur Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Secret DISCORD_WEBHOOK_URL absent : l'APK n'est pas envoyé sur Discord (il reste dans les artefacts du workflow)."
            exit 0
          fi
          curl -sS --fail \
            -F "payload_json={\"content\":\"Nouvel APK Triche Stack (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})\"}" \
            -F "file=@triche-stack.apk" \
            "$DISCORD_WEBHOOK_URL"
